[package]
name = "verbot-tui"
version = "0.1.0"
edition = "2021"
description = "Verbocity (verbot) — Interactive terminal LLM prompt template engine and agy dispatcher"
license = "MIT"

[lib]
name = "verbot_tui"
path = "src/lib.rs"

[[bin]]
name = "verbot-tui"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
dirs = "5.0"
ignore = "0.4"
ratatui = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"
tui-textarea = { version = "0.7", features = ["ratatui"] }
unicode-width = "0.2"
